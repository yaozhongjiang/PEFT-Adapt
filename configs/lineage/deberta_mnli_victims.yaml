experiment:
  name: deberta_mnli_lineage_victims
  output_root: artifact
  seed: 7
  local_only: false
model:
  model_id: microsoft/deberta-v3-base
  revision: main
  tokenizer_id: microsoft/deberta-v3-base
  task_type: sequence_classification
  dtype: float32
  local_files_only: false
data:
  dataset_name: glue
  dataset_config: mnli
  task_name: mnli
  train_split: train
  eval_split: validation_matched
  probe_split: validation_matched
  text_fields: [premise, hypothesis]
  label_field: label
  num_labels: 3
  max_length: 256
  max_train_samples: 10000
  max_eval_samples: 2000
  max_probe_samples: 1500
  probe_selection_seed: 2026
seeds:
  victim: [301, 302, 303, 304, 305, 306, 307, 308, 309, 310, 311, 312, 313, 314, 315, 316]
  probe: [7, 42, 123]
training:
  learning_rate: 0.0001
  weight_decay: 0.01
  train_batch_size: 8
  eval_batch_size: 16
  gradient_accumulation_steps: 2
  epochs: 3
  warmup_ratio: 0.06
  fp16: true
  eval_strategy: epoch
  save_strategy: "no"
structures:
  - name: lora_r64
    family: lora
    rank: 64
    alpha: 128
    target_modules: [query_proj, value_proj]
    modules_to_save: [classifier]
    known: true
interface:
  mode: full_logits
inference:
  batch_size: 16
  disjoint_probe_views: true
