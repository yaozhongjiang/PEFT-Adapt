experiment:
  name: bert_mnli_openworld_victims
  output_root: artifact
  seed: 7
  local_only: false
model:
  model_id: google-bert/bert-base-uncased
  revision: main
  tokenizer_id: google-bert/bert-base-uncased
  task_type: sequence_classification
  dtype: float32
  local_files_only: false
data:
  dataset_name: glue
  dataset_config: mnli
  task_name: mnli
  train_split: train
  eval_split: validation_matched
  probe_split: validation_matched
  text_fields: [premise, hypothesis]
  label_field: label
  num_labels: 3
  max_length: 256
  max_train_samples: 10000
  max_eval_samples: 2000
  max_probe_samples: 1500
  probe_selection_seed: 2026
seeds:
  # Core open-set grid expanded to 10 victim-training seeds for tighter CIs.
  # Existing seeds {11..66} are skipped when checkpoints already exist.
  victim: [11, 22, 33, 44, 55, 66, 77, 88, 99, 110]
  probe: [7, 42, 123]
training:
  learning_rate: 0.0002
  weight_decay: 0.01
  train_batch_size: 16
  eval_batch_size: 32
  gradient_accumulation_steps: 1
  epochs: 3
  warmup_ratio: 0.06
  fp16: true
  eval_strategy: epoch
  save_strategy: "no"
structures:
  - name: lora_r8
    family: lora
    rank: 8
    alpha: 16
    target_modules: [query, value]
    modules_to_save: [classifier]
    known: true
  - name: lora_r64
    family: lora
    rank: 64
    alpha: 128
    target_modules: [query, value]
    modules_to_save: [classifier]
    known: true
  - name: lora_r256
    family: lora
    rank: 256
    alpha: 512
    target_modules: [query, value]
    modules_to_save: [classifier]
    known: true
  - name: lora_r4_unknown
    family: lora
    rank: 4
    alpha: 8
    target_modules: [query, value]
    modules_to_save: [classifier]
    known: false
  - name: lora_r16_unknown
    family: lora
    rank: 16
    alpha: 32
    target_modules: [query, value]
    modules_to_save: [classifier]
    known: false
  - name: lora_r32_unknown
    family: lora
    rank: 32
    alpha: 64
    target_modules: [query, value]
    modules_to_save: [classifier]
    known: false
  - name: lora_r128_unknown
    family: lora
    rank: 128
    alpha: 256
    target_modules: [query, value]
    modules_to_save: [classifier]
    known: false
  - name: dora_r64_unknown
    family: dora
    rank: 64
    alpha: 128
    target_modules: [query, value]
    modules_to_save: [classifier]
    known: false
  - name: ia3_unknown
    family: ia3
    target_modules: [key, value, output.dense]
    feedforward_modules: [output.dense]
    modules_to_save: [classifier]
    known: false
  - name: lora_head_r64_unknown
    family: lora_head
    rank: 64
    alpha: 128
    target_modules: [query, value]
    modules_to_save: [classifier]
    head_patterns: [classifier]
    known: false
  - name: nonuniform_lora_unknown
    family: nonuniform_lora
    rank: 8
    alpha: 16
    target_modules: [query, value]
    modules_to_save: [classifier]
    rank_pattern:
      bert.encoder.layer.0.attention.self.query: 4
      bert.encoder.layer.3.attention.self.query: 16
      bert.encoder.layer.6.attention.self.query: 32
      bert.encoder.layer.9.attention.self.query: 64
    known: false
  - name: alternate_targets_unknown
    family: lora
    rank: 64
    alpha: 128
    target_modules: [key, query, value, attention.output.dense]
    modules_to_save: [classifier]
    known: false
interface:
  mode: full_logits
inference:
  batch_size: 32
  disjoint_probe_views: true
