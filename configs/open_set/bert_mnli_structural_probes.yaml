experiment:
  name: bert_mnli_openworld_structural_probes
  output_root: artifact
  seed: 7
  local_only: false
model:
  model_id: google-bert/bert-base-uncased
  revision: main
  tokenizer_id: google-bert/bert-base-uncased
  task_type: sequence_classification
  dtype: float32
  local_files_only: false
data:
  dataset_name: glue
  dataset_config: mnli
  task_name: mnli
  train_split: train
  eval_split: validation_matched
  probe_split: validation_matched
  text_fields: [premise, hypothesis]
  label_field: label
  num_labels: 3
  max_length: 256
  max_probe_samples: 240
  probe_selection_seed: 2026
seeds:
  probe: [7, 42, 123]
inputs:
  victim_grid_json: artifact/models/bert_mnli_openworld_victims/victim_grid.json
probes:
  structural_active: true
  max_variants_per_source: 4
  required_families: [template_nli, layer_early, module_head]
  families:
    - template_nli
    - template_contradict
    - layer_early
    - layer_late
    - module_head
    - lexical_local
interface:
  mode: full_logits
inference:
  batch_size: 32
  disjoint_probe_views: true
